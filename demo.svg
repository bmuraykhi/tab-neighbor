        <circle cx="17" cy="17" r="6" fill="#79c0ff"/>
        <text class="lbl" x="34" y="22">Mail</text>
      </g>
      <g transform="translate(0,126)">
        <rect class="tab" width="288" height="34" rx="7"/>
        <circle cx="17" cy="17" r="6" fill="#d2a8ff"/>
        <text class="lbl" x="34" y="22">News</text>
      </g>
