      <circle cx="17" cy="17" r="6" fill="#ffa657"/>
      <text class="lbl" x="34" y="22">Music</text>
    </g>
    <g class="newtab" transform="translate(0,210)">
      <rect width="288" height="34" rx="7" fill="#172a45" stroke="#2f6feb"/>
      <circle cx="17" cy="17" r="6" fill="#8ab4f8"/>
      <text class="lbl" x="34" y="22" fill="#8ab4f8">New Tab</text>
    </g>
  </g>
  <g transform="translate(426,106)">
    <rect class="tab" width="288" height="34" rx="7"/>
    <circle cx="17" cy="17" r="6" fill="#f78166"/>
    <text class="lbl" x="34" y="22">Docs</text>
    <g transform="translate(0,42)">
