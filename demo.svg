<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .badge { opacity: 0; animation: badge 6s ease infinite; }
    @keyframes badge { 0%, 18% { opacity: 0; } 24%, 62% { opacity: 1; } 70%, 100% { opacity: 0; } }
    .shift { animation: shift 6s ease infinite; }
    @keyframes shift { 0%, 30% { transform: translateY(0); } 40%, 84% { transform: translateY(42px); } 94%, 100% { transform: translateY(0); } }
    .newtab { opacity: 0; animation: pop 6s ease infinite; }
    @keyframes pop { 0%, 34% { opacity: 0; } 44%, 82% { opacity: 1; } 92%, 100% { opacity: 0; } }
    text { fill: #c9d1d9; font-size: 13px; }
    .muted { fill: #8b949e; font-size: 12px; letter-spacing: .04em; }
    .tab { fill: #21262d; }
    .lbl { pointer-events: none; }
  </style>
  <rect width="760" height="420" rx="12" fill="#161b22"/>
  <g class="badge">
    <rect x="338" y="26" width="84" height="32" rx="7" fill="#30363d" stroke="#8b949e"/>
    <text x="380" y="47" text-anchor="middle" font-size="15" font-weight="600">⌘ T</text>
  </g>
  <text class="muted" x="30" y="82">CHROME DEFAULT</text>
  <text class="muted" x="410" y="82">WITH TAB NEIGHBOR</text>
  <rect x="30" y="90" width="320" height="300" rx="10" fill="#0d1117"/>
